name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The offline suites only. The live tests spawn the real `claude` binary and need
      # credentials, so they stay opt-in and never run in CI.
      - name: Test
        run: swift test
