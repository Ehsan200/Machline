name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The runner tracks the toolchain the app is developed against. macos-15 ships Xcode 16 and
    # has never been tried against this package.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      # The offline suites only. The live tests spawn the real `claude` binary and need
      # credentials, so they stay opt-in and never run in CI.
      - name: Test
        run: swift test
